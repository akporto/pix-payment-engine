name: Promote dev → main

on:
  push:
    branches:
      - dev

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Run full test suite (unit + integration)
        run: ./mvnw verify --batch-mode --no-transfer-progress

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-failsafe-reports-dev
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  open-pr:
    name: Open Pull Request → main
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: dev
          title: "release: [Auto-PR] Promote dev → main (${{ github.sha }})"
          body: |
            ## Promoção automática: `dev` → `main`

            ### Commit que disparou
            ${{ github.sha }}

            ### Status dos testes na branch `dev`
            Todos os testes passaram antes da abertura deste PR:

            - **Testes unitários** (`MoneyTest`, `AccountTest`, `PaymentTest`, `PaymentControllerTest`) — sem Docker.
            - **Testes de integração** (`ProcessPaymentUseCaseIntegrationTest`, `IdempotencyIntegrationTest`) — PostgreSQL e Redis via Testcontainers.

            ### O que esta release contém
            - Exactly-once semantics via `X-Idempotency-Key` (Redis fast-path + DB fallback).
            - Pessimistic Locking com ordered UUID acquisition (zero deadlocks).
            - Transactional Outbox Pattern — consistência entre PostgreSQL e Kafka.
            - Regras de domínio validadas: `Money`, `Account`, `Payment`.
            - Contrato HTTP validado: 201 / 200 / 422 / 404 / 400.

            ### Checklist antes do merge
            - [ ] Revisão de código aprovada por ao menos 1 revisor.
            - [ ] Sem conflitos com `main`.
            - [ ] Changelog atualizado (se aplicável).

            ---
            > PR criado automaticamente pelo workflow `promote-to-main.yml` após merge em `dev`.
            > **Não faça squash/rebase** — preserve o histórico de commits para rastreabilidade.
          labels: release, automated-pr
          draft: false
