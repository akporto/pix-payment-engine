name: CI — Test & Auto PR to develop

on:
  push:
    branches-ignore:
      - main
      - develop

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  open-pr:
    name: Open Pull Request → develop
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "ci: [Auto-PR] Integration of branch ${{ github.ref_name }}" \
            --body "## Auto-PR gerado pelo workflow de CI

          ### Branch
          \`${{ github.ref_name }}\` → \`develop\`

          ### Commit
          ${{ github.sha }}

          ### Status dos testes
          Testes unitários passaram com sucesso antes da abertura deste PR:

          - **Testes unitários** (\`MoneyTest\`, \`AccountTest\`, \`PaymentTest\`, \`PaymentControllerTest\`) — execução rápida, sem Docker.

          > Os testes de integração (Testcontainers) são executados na esteira \`promote-to-main.yml\`, durante o merge de \`develop\` → \`main\`.

          ### O que foi validado
          - Regras de domínio: \`Money\`, \`Account\`, \`Payment\`.
          - Contrato HTTP: status 201/200/422/404/400.

          ---
          > PR criado automaticamente pelo workflow \`ci.yml\`. Revise antes de fazer o merge." \
          || echo "PR already exists for this branch."
